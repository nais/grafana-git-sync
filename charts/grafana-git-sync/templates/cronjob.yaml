apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "grafana-git-sync.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            {{- include "grafana-git-sync.labels" . | nindent 12 }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "grafana-git-sync.serviceAccountName" . }}
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: grafana-git-sync
              image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: GRAFANA_URL
                  value: {{ required "grafana.url is required" .Values.grafana.url | quote }}
                - name: GRAFANA_NAMESPACE
                  value: {{ .Values.grafana.namespace | quote }}
                - name: GITHUB_APP_ID
                  value: {{ required "github.appID is required" .Values.github.appID | quote }}
                - name: GITHUB_APP_INSTALLATION_ID
                  value: {{ required "github.installationID is required" .Values.github.installationID | quote }}
                - name: GRAFANA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "existingSecret.name is required" .Values.existingSecret.name }}
                      key: {{ .Values.existingSecret.grafanaTokenKey }}
                - name: GITHUB_APP_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret.name }}
                      key: {{ .Values.existingSecret.githubAppPrivateKeyKey }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
