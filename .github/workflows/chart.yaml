name: Build and push chart
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/chart.yaml"
permissions:
  contents: "read"
jobs:
  build:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # ratchet:jdx/mise-action@v4.0.1
      - run: mise run check:helm
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: "gh-grafana-git-sync@nais-io.iam.gserviceaccount.com"
          token_format: "access_token"
      - name: "Log in to Google Artifact Registry"
        run: |-
          echo '${{ steps.auth.outputs.access_token }}' | helm registry login -u oauth2accesstoken --password-stdin https://europe-north1-docker.pkg.dev
      - name: Package and push chart
        # The chart version in Chart.yaml is bumped manually; pushing an existing version fails.
        run: |-
          helm package charts/grafana-git-sync
          helm push grafana-git-sync-*.tgz oci://europe-north1-docker.pkg.dev/nais-io/nais
